spring.application.name=fluxo-conhecimento

# Banco PostgreSQL (RNF14)
spring.datasource.url=jdbc:postgresql://localhost:5432/fluxoconhecimento
spring.datasource.username=postgres
spring.datasource.password=postgres

# Script equivalente: docs/banco/schema-postgresql.sql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Segurança - sessão expira em 30 min (RNF10)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Administrador criado na primeira execução (trocar a senha depois)
knowflow.admin.nome=Administrador
knowflow.admin.email=admin@knowflow.com
knowflow.admin.senha=Admin1234

# Web - em desenvolvimento serve o frontend direto da pasta ../frontend
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
spring.web.resources.cache.period=0

# Anexos (RF16)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Recuperação de senha (RF14) - sem spring.mail.host o link aparece no log
knowflow.url-base=http://localhost:8080
knowflow.email.remetente=nao-responda@knowflow.com
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=seu-email@gmail.com
# spring.mail.password=sua-senha-de-app
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger: http://localhost:8080/swagger-ui.html (entrar no sistema antes)
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
