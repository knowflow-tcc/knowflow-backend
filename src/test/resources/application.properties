# Só para os testes: H2 em memória
spring.datasource.url=jdbc:h2:mem:testes;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
server.servlet.session.timeout=30m

knowflow.admin.nome=Administrador
knowflow.admin.email=admin@knowflow.com
knowflow.admin.senha=Admin1234

spring.web.resources.static-locations=classpath:/static/

knowflow.url-base=http://localhost:8080
knowflow.email.remetente=nao-responda@knowflow.com
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
springdoc.swagger-ui.csrf.enabled=true
